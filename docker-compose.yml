services:
  api-server:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @ai-content-factory/api-server dev"
    ports:
      - "4000:4000"
    volumes:
      - .:/workspace
      - pnpm-store:/root/.local/share/pnpm/store
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/ai_content_factory
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: content-factory
      UPLOAD_DEFAULT_PRIVACY: private
      ENABLE_AUTO_PUBLIC: "false"
    depends_on:
      - mongo
      - redis
      - minio

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data

volumes:
  mongo-data:
  redis-data:
  minio-data:
  pnpm-store:
