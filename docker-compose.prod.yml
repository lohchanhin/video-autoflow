services:
  api-server:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command: sh -c "corepack enable && corepack pnpm --filter @ai-content-factory/api-server build && corepack pnpm --filter @ai-content-factory/api-server start"
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/ai_content_factory
      REDIS_URL: redis://redis:6379
      UPLOAD_DEFAULT_PRIVACY: private
      ENABLE_AUTO_PUBLIC: "false"
    volumes:
      - .:/workspace
      - pnpm-store:/root/.local/share/pnpm/store
      - ./uploads:/workspace/uploads
    depends_on:
      - mongo
      - redis

  admin-web:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command: sh -c "corepack enable && corepack pnpm --filter @ai-content-factory/admin-web build && corepack pnpm --filter @ai-content-factory/admin-web exec vite preview --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - .:/workspace
      - pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      - api-server

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
  pnpm-store:
